[project]
name = "patterns-tutor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.10",
    "langchain-openai>=1.7.1",
    "langchain-text-splitters>=1.1.3",
    "pymupdf>=1.28.2",
]

[project.scripts]
patterns-tutor = "patterns_tutor:main"
patterns-tutor-ingest = "patterns_tutor.ingestion:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
